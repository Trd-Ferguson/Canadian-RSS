name: Feed Rebuild & Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  manual-rebuild-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser lxml requests

      - name: Rebuild feed data
        run: |
          set -euo pipefail
          mkdir -p "Aggregated Feed"
          python aggregate.py

      - name: Commit and push updated feed data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Aggregator Bot"
          git config user.email "bot@gnu.org"

          git add -- \
            "Aggregated Feed/feed.xml" \
            "Aggregated Feed/feed_status_log.json" \
            "feeds/feeds.json"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Manual Sync: Rebuild feed.xml ($(date -u --iso-8601=seconds))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'Aggregated Feed`

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
